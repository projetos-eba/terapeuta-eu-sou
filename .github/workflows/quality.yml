name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: quality-${{ github.workflow }}-${{ github.ref }}

jobs:
  quality:
    name: Static, unit and Edge Function checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check changed-file formatting
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/check-changed-format.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: lts

      - name: Edge Function tests
        run: npm run test:deno

      - name: Production build
        run: npm run build

# Browser, Supabase, Stripe and Zoom qualification run separately. They require
# controlled integration fixtures and must not receive production credentials.
